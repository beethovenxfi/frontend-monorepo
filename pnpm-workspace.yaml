packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@reown/appkit": true
  bufferutil: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  utf-8-validate: true

catalog:
  "@apollo/client": "4.3.3"

peerDependencyRules:
  allowedVersions:
    "@types/react": ^19.0.0
    "@types/react-dom": ^19.0.0
    react: ^19.0.0
    react-dom: ^19.0.0
    # @vitest/mocker declares msw@^2.4.9 but msw@3 works — accepting it keeps a
    # single vitest peer variant; otherwise pnpm installs a second vitest copy
    # and inline snapshots break (duplicate SnapshotClient singletons).
    msw: ">=2.4.9"

overrides:
  "@types/react": "19.3"
  "@types/react-dom": "19.3"
  # @reown/appkit-wallet pins zod@3.22.4 (no v4/ subpath), but @hookform/resolvers
  # imports zod/v4/core as a phantom dep. Force 3.25.76 so both resolve correctly.
  "zod": "3.25.76"
  # @vitest/mocker's optional msw peer (^2.4.9) would otherwise pull a second
  # msw + vitest instance into tests; v3 satisfies it (used in browser mode only).
  "@vitest/mocker>msw": "3.0.0"

publicHoistPattern:
  - "*graphql*" # https://github.com/vercel/next.js/issues/68805
  - "@reown/*" # Fix for @reown/appkit resolution in Next + pnpm

minimumReleaseAgeExclude:
  - "@balancer/sdk@6.2.0"
  - "@eslint-react/ast@5.19.1"
  - "@eslint-react/core@5.19.1"
  - "@eslint-react/eslint-plugin@5.19.1"
  - "@eslint-react/eslint@5.19.1"
  - "@eslint-react/jsx@5.19.1"
  - "@eslint-react/shared@5.19.1"
  - "@eslint-react/var@5.19.1"
  - eslint-plugin-react-dom@5.19.1
  - eslint-plugin-react-jsx@5.19.1
  - eslint-plugin-react-naming-convention@5.19.1
  - eslint-plugin-react-rsc@5.19.1
  - eslint-plugin-react-web-api@5.19.1
  - eslint-plugin-react-x@5.19.1
