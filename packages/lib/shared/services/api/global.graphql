query GetAppGlobalPollingData($chains: [GqlChain!]!, $chain: GqlChain!) {
  tokenGetCurrentPrices(chains: $chains) {
    price
    address
  }
  protocolMetricsChain(chain: $chain) {
    totalLiquidity
    poolCount
    swapFee24h
    swapVolume24h
  }
}

query GetTokens($chains: [GqlChain!]!) {
  tokens: tokenGetTokens(chains: $chains) {
    address
    name
    symbol
    decimals
    chain
    chainId
    logoURI
    priority
    tradable
    isErc4626
    isBufferAllowed
    coingeckoId
    priceRateProviderData {
      address
      reviewed
      name
      warnings
    }
  }
}

query GetApiHealth {
  protocolMetricsChain(chain: SONIC) {
    poolCount
  }
}

query GetTokenPrices($chains: [GqlChain!]!) {
  tokenPrices: tokenGetCurrentPrices(chains: $chains) {
    price
    address
    chain
    updatedAt
  }
}
