#import "./hook.graphql"

fragment UnderlyingToken on GqlToken {
  chain
  chainId
  address
  decimals
  name
  symbol
  isErc4626
  logoURI
}

fragment Erc4626ReviewData on Erc4626ReviewData {
  reviewFile
  summary
  warnings
}

fragment PoolTokens on GqlPoolTokenDetail {
  id
  # The following field match UnderlyingToken token fragment
  chain
  chainId
  address
  decimals
  name
  symbol
  canUseBufferForSwaps
  useWrappedForAddRemove
  useUnderlyingForAddRemove
  index
  balance
  balanceUSD
  priceRate
  decimals
  weight
  isAllowed
  priceRateProvider
  logoURI
  priceRateProviderData {
    address
    name
    summary
    reviewed
    warnings
    upgradeableComponents {
      entryPoint
      implementationReviewed
    }
    reviewFile
    factory
  }
  isErc4626
  maxDeposit
  maxWithdraw
  underlyingToken {
    ...UnderlyingToken
  }
  erc4626ReviewData {
    ...Erc4626ReviewData
  }
}
