#import "./pool-tokens.graphql"

query GetPool($id: String!, $chain: GqlChain!, $userAddress: String) {
  pool: poolGetPool(id: $id, chain: $chain, userAddress: $userAddress) {
    address
    chain
    createTime
    decimals
    dynamicData {
      aprItems {
        apr
        id
        rewardTokenAddress
        rewardTokenSymbol
        type
      }
      fees24h
      holdersCount
      isInRecoveryMode
      isPaused
      poolId
      swapEnabled
      swapFee
      totalLiquidity
      totalShares
      volume24h
    }
    factory
    hasErc4626
    hook {
      ...Hook
    }
    id
    liquidityManagement {
      disableUnbalancedLiquidity
    }
    name
    pauseManager
    poolCreator
    poolTokens {
      ...PoolTokens
    }
    protocolVersion
    staking {
      address
      chain
      gauge {
        gaugeAddress
        id
        otherGauges {
          gaugeAddress
          id
          rewards {
            id
            rewardPerSecond
            tokenAddress
          }
          status
          version
        }
        rewards {
          id
          rewardPerSecond
          tokenAddress
        }
        status
        version
        workingSupply
      }
      reliquary {
        levels {
          level
          balance
          apr
          allocationPoints
        }
        beetsPerSecond
        totalBalance
      }
      id
      type
    }
    swapFeeManager
    symbol
    tags
    type
    userBalance {
      stakedBalances {
        balance
        balanceUsd
        stakingId
        stakingType
      }
      totalBalance
      totalBalanceUsd
      walletBalance
      walletBalanceUsd
    }
    version
    ... on GqlPoolComposableStable {
      amp
      bptPriceRate
    }
    ... on GqlPoolLiquidityBootstrappingV3 {
      ...LbpV3CommonMetadataFields
    }
    ... on GqlPoolFixedPriceLBP {
      ...FixedPriceLbpCommonMetadataFields
    }
    ... on GqlPoolGyro {
      alpha
      beta
      c
      dSq
      lambda
      root3Alpha
      s
      sqrtAlpha
      sqrtBeta
      tauAlphaX
      tauAlphaY
      tauBetaX
      tauBetaY
      type
      u
      v
      w
      z
    }
    ... on GqlPoolQuantAmmWeighted {
      hasAnyAllowedBuffer
      weightSnapshots {
        timestamp
        weights
      }
      poolTokens {
        ...PoolTokens
      }
    }
    ... on GqlPoolReClamm {
      centerednessMargin
      currentFourthRootPriceRatio
      dailyPriceShiftBase
      endFourthRootPriceRatio
      hasAnyAllowedBuffer
      lastTimestamp
      lastVirtualBalances
      priceRatioUpdateEndTime
      priceRatioUpdateStartTime
      startFourthRootPriceRatio
    }
    ... on GqlPoolStable {
      amp
    }
  }
}

query GetPoolSnapshots($poolId: String!, $range: GqlPoolSnapshotDataRange!, $chainId: GqlChain!) {
  snapshots: poolGetSnapshots(id: $poolId, range: $range, chain: $chainId) {
    id
    timestamp
    totalLiquidity
    volume24h
    fees24h
    sharePrice
  }
}

query GetPoolEvents(
  $first: Int
  $skip: Int
  $poolId: String
  $chainIn: [GqlChain!]!
  $type: GqlPoolEventType
  $userAddress: String
) {
  poolEvents(
    first: $first
    skip: $skip
    where: { poolId: $poolId, chainIn: $chainIn, type: $type, userAddress: $userAddress }
  ) {
    id
    poolId
    timestamp
    tx
    type
    valueUSD
    chain
    userAddress
    ... on GqlPoolSwapEventV3 {
      sender
      tokenIn {
        address
        amount
      }
      tokenOut {
        address
        amount
      }
    }
    ... on GqlPoolAddRemoveEventV3 {
      tokens {
        address
        amount
        valueUSD
      }
    }
  }
}
